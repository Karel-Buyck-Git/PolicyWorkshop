# GitHub Actions — builds the epac .skill and attaches it to a GitHub Release on a version tag.
#
# NOTE ON LOCATION: GitHub Actions only runs workflows from `.github/workflows/` at the REPO ROOT.
# This file currently lives next to the skill (in a subfolder) for convenience; to activate it,
# copy it to <repo-root>/.github/workflows/build.yml and keep `working-directory` below pointing
# at this skill folder.
#
# Tag a release to trigger:  git tag v1.0.0 && git push --tags

name: build-epac-skill

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release

env:
  # Path from the repo root to the epac skill folder. Adjust if the repo layout changes.
  SKILL_DIR: product/lab/prototypes/lab-11/skills/azure-cloud-solutions/epac

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build epac.skill
        working-directory: ${{ env.SKILL_DIR }}
        run: |
          chmod +x ./build.sh
          ./build.sh
          ls -l dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: epac-skill
          path: ${{ env.SKILL_DIR }}/dist/epac.skill

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SKILL_DIR }}/dist/epac.skill
