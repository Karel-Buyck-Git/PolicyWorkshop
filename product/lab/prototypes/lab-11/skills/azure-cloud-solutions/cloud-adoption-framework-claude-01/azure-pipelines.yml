# Azure DevOps pipeline — builds the cloud-adoption-framework .skill and publishes it on a version tag.
#
# NOTE ON LOCATION: Azure DevOps expects azure-pipelines.yml at (or referenced from) the repo root.
# This skill lives in a subfolder, so set `skillDir` below to the path from the repo root to this
# folder, or move/copy this file to the repo root. The build runs from `skillDir`.
#
# Tag a release to trigger:  git tag caf-v1.0.0 && git push --tags

trigger:
  branches:
    include:
      - refs/tags/caf-v*

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  # Path from the repo root to this skill folder. Adjust if the repo layout changes.
  skillDir: product/lab/prototypes/lab-11/skills/azure-cloud-solutions/cloud-adoption-framework

steps:
  - checkout: self
    fetchDepth: 0

  - task: PowerShell@2
    displayName: Build cloud-adoption-framework.skill
    inputs:
      targetType: inline
      pwsh: true
      workingDirectory: $(skillDir)
      script: |
        ./build.ps1
        Get-ChildItem dist

  - task: PublishBuildArtifacts@1
    displayName: Publish .skill artifact
    inputs:
      PathtoPublish: $(skillDir)/dist/cloud-adoption-framework.skill
      ArtifactName: cloud-adoption-framework-skill
