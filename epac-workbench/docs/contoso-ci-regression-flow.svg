<svg viewBox="0 0 900 730" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Contoso CI — regression / determinism check</title>
  <desc>On any push or pull request touching the engine, catalogue, example or shared schemas, the "contoso epac build" workflow runs examples/contoso/verify.sh. verify.sh rebuilds the worked contoso sample for each renderer flavour (json, terraform, bicep) into a temp dir and diffs each byte-for-byte against the committed golden tree (package/ for json, fixtures/terraform and fixtures/bicep for the others). If every tree is byte-identical the check passes (the engine is deterministic); any difference fails the build and verify.sh prints the diff.</desc>
  <style>
    svg{--ink:#1f2328;--sub:#5b6470;--line:#c4cad2;--panel:#f3f5f8;--panelLine:#d3d9e0;--acc:#4f46e5;--accBg:#ecedfb;--accLine:#b9bbf3;--ok:#1a7f37;--okBg:#e6f4ea;--okLine:#9bd0aa;--bad:#cf222e;--badBg:#fbe9ea;--badLine:#f0b3b7;}
    @media (prefers-color-scheme:dark){svg{--ink:#e8ebef;--sub:#a3acb9;--line:#3a424d;--panel:#171b21;--panelLine:#2b323b;--acc:#9b95f5;--accBg:#23223a;--accLine:#3d3a66;--ok:#3fb950;--okBg:#12261a;--okLine:#2a5335;--bad:#f85149;--badBg:#2b1416;--badLine:#5c2a2c;}}
    .b{fill:var(--panel);stroke:var(--panelLine);stroke-width:1.5;}
    .c{fill:var(--accBg);stroke:var(--accLine);stroke-width:1.5;}
    .cat{fill:var(--panel);stroke:var(--accLine);stroke-width:1.5;}
    .ok{fill:var(--okBg);stroke:var(--okLine);stroke-width:1.5;}
    .bad{fill:var(--badBg);stroke:var(--badLine);stroke-width:1.5;}
    .t{fill:var(--ink);font-weight:700;}
    .s{fill:var(--sub);}
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}
    .band{fill:var(--sub);font-weight:700;letter-spacing:.06em;}
    .okT{fill:var(--ok);font-weight:700;}
    .badT{fill:var(--bad);font-weight:700;}
    .e{fill:none;stroke:var(--line);stroke-width:1.6;}
    .ae{fill:none;stroke:var(--acc);stroke-width:1.8;}
    .oke{fill:none;stroke:var(--ok);stroke-width:1.8;}
    .bade{fill:none;stroke:var(--bad);stroke-width:1.8;}
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--line)"/></marker>
    <marker id="aah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--acc)"/></marker>
    <marker id="okh" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--ok)"/></marker>
    <marker id="badh" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--bad)"/></marker>
  </defs>

  <text class="band" x="24" y="17" font-size="11">CONTOSO CI — REGRESSION / DETERMINISM CHECK</text>

  <!-- legend -->
  <rect class="b"   x="560" y="8" width="13" height="13" rx="3"/><text class="s" x="578" y="18" font-size="10.5">step / workflow</text>
  <rect class="c"   x="676" y="8" width="13" height="13" rx="3"/><text class="s" x="694" y="18" font-size="10.5">verify.sh</text>
  <rect class="cat" x="760" y="8" width="13" height="13" rx="3"/><text class="s" x="778" y="18" font-size="10.5">committed fixture</text>

  <!-- trigger -->
  <rect class="b" x="180" y="40" width="540" height="54" rx="9"/>
  <text class="t" x="450" y="63" text-anchor="middle" font-size="12.5">push  /  pull_request</text>
  <text class="s mono" x="450" y="81" text-anchor="middle" font-size="9.5">paths: engine/** · catalogue/** · examples/contoso/** · customer/manifests/**</text>

  <path class="e" d="M450,94 V118" marker-end="url(#ah)"/>

  <!-- workflow -->
  <rect class="b" x="210" y="118" width="480" height="54" rx="9"/>
  <text class="t mono" x="450" y="141" text-anchor="middle" font-size="12">.github/workflows/contoso-epac-build.yml</text>
  <text class="s" x="450" y="159" text-anchor="middle" font-size="9.5">name “contoso epac build” — thin trigger (Actions requires YAML under .github/workflows/)</text>

  <path class="e" d="M450,172 V196" marker-end="url(#ah)"/>
  <text class="s" x="458" y="190" font-size="9.5">runs</text>

  <!-- inputs -->
  <rect class="b" x="24" y="194" width="196" height="60" rx="9"/>
  <text class="t" x="122" y="214" text-anchor="middle" font-size="11.5">Inputs (read-only)</text>
  <text class="s mono" x="122" y="230" text-anchor="middle" font-size="9">manifest.example.jsonc</text>
  <text class="s mono" x="122" y="244" text-anchor="middle" font-size="9">designs/ · catalogue/ · schemas</text>
  <path class="ae" d="M220,224 H250" marker-end="url(#aah)"/>

  <!-- verify.sh -->
  <rect class="c" x="250" y="196" width="400" height="56" rx="9"/>
  <text class="t mono" x="450" y="220" text-anchor="middle" font-size="12.5">examples/contoso/verify.sh</text>
  <text class="s" x="450" y="239" text-anchor="middle" font-size="9.5">the pipeline logic — runnable locally: <tspan class="mono">bash examples/contoso/verify.sh</tspan></text>

  <!-- fan-out to per-flavour builds -->
  <path class="ae" d="M430,252 V286 H180 V310" marker-end="url(#aah)"/>
  <path class="ae" d="M450,252 V310" marker-end="url(#aah)"/>
  <path class="ae" d="M470,252 V286 H720 V310" marker-end="url(#aah)"/>
  <text class="s" x="500" y="278" font-size="9.5">for each flavour →</text>

  <!-- rebuilds (temp) -->
  <rect class="c" x="70"  y="310" width="220" height="56" rx="9"/>
  <text class="t mono" x="180" y="334" text-anchor="middle" font-size="12">build --only json</text>
  <text class="s mono" x="180" y="351" text-anchor="middle" font-size="9">assemble_scaffold.py → temp</text>

  <rect class="c" x="340" y="310" width="220" height="56" rx="9"/>
  <text class="t mono" x="450" y="334" text-anchor="middle" font-size="12">build --only terraform</text>
  <text class="s mono" x="450" y="351" text-anchor="middle" font-size="9">assemble_scaffold.py → temp</text>

  <rect class="c" x="610" y="310" width="220" height="56" rx="9"/>
  <text class="t mono" x="720" y="334" text-anchor="middle" font-size="12">build --only bicep</text>
  <text class="s mono" x="720" y="351" text-anchor="middle" font-size="9">assemble_scaffold.py → temp</text>

  <!-- diff against committed fixture -->
  <path class="ae" d="M180,366 V406" marker-end="url(#aah)"/><text class="s mono" x="188" y="392" font-size="9">diff -rq</text>
  <path class="ae" d="M450,366 V406" marker-end="url(#aah)"/><text class="s mono" x="458" y="392" font-size="9">diff -rq</text>
  <path class="ae" d="M720,366 V406" marker-end="url(#aah)"/><text class="s mono" x="728" y="392" font-size="9">diff -rq</text>

  <!-- committed golden trees -->
  <rect class="cat" x="70"  y="406" width="220" height="58" rx="9"/>
  <text class="t mono" x="180" y="430" text-anchor="middle" font-size="12">package/</text>
  <text class="s" x="180" y="448" text-anchor="middle" font-size="9.5">json · the worked sample</text>

  <rect class="cat" x="340" y="406" width="220" height="58" rx="9"/>
  <text class="t mono" x="450" y="430" text-anchor="middle" font-size="12">fixtures/terraform/</text>
  <text class="s" x="450" y="448" text-anchor="middle" font-size="9.5">terraform</text>

  <rect class="cat" x="610" y="406" width="220" height="58" rx="9"/>
  <text class="t mono" x="720" y="430" text-anchor="middle" font-size="12">fixtures/bicep/</text>
  <text class="s" x="720" y="448" text-anchor="middle" font-size="9.5">bicep</text>

  <!-- merge to gate -->
  <path class="ae" d="M180,464 V500 H450 V524" marker-end="url(#aah)"/>
  <path class="ae" d="M450,464 V524" marker-end="url(#aah)"/>
  <path class="ae" d="M720,464 V500 H450 V524" marker-end="url(#aah)"/>

  <!-- gate -->
  <rect class="b" x="270" y="524" width="360" height="54" rx="9"/>
  <text class="t" x="450" y="547" text-anchor="middle" font-size="12.5">all three trees byte-identical?</text>
  <text class="s mono" x="450" y="565" text-anchor="middle" font-size="9.5">diff -rq reports no differences</text>

  <!-- outcomes -->
  <path class="oke"  d="M420,578 V606 H300 V632" marker-end="url(#okh)"/><text class="s" x="366" y="600" font-size="9.5">yes</text>
  <path class="bade" d="M480,578 V606 H620 V632" marker-end="url(#badh)"/><text class="s" x="560" y="600" font-size="9.5">any differ</text>

  <rect class="ok" x="180" y="632" width="240" height="58" rx="9"/>
  <text class="okT" x="300" y="657" text-anchor="middle" font-size="13">✓  PASS</text>
  <text class="s" x="300" y="676" text-anchor="middle" font-size="9.5">engine deterministic — safe to merge</text>

  <rect class="bad" x="500" y="632" width="260" height="58" rx="9"/>
  <text class="badT" x="630" y="657" text-anchor="middle" font-size="13">✗  FAIL</text>
  <text class="s" x="630" y="676" text-anchor="middle" font-size="9.5">drift — verify.sh prints the diff; block merge</text>

  <!-- footnote -->
  <text class="s" x="24" y="716" font-size="9.5">Committed golden trees live under <tspan class="mono">examples/contoso/</tspan> and are generated, never hand-edited — to accept a change, rebuild with <tspan class="mono">--only &lt;flavour&gt;</tspan> and commit the diff.</text>
</svg>
