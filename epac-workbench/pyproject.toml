# epac-workbench — Python project marker.
#
# This project is STDLIB-ONLY by design: every module under engine/ imports only
# from the CPython standard library. There are no third-party runtime
# dependencies, so `dependencies` below is intentionally empty — that emptiness
# is the point of this file. Run the tools directly, e.g.
#
#     python engine/epac_builder/assemble_scaffold.py --manifest ... --out ...
#
# No `pip install` step is required. Nothing here is published to PyPI; there is
# deliberately no [build-system] table.

[project]
name = "epac-workbench"
# Kept in lockstep with engine/shared/version.py and the v* git tags by
# engine/tools/release.py (auto-SemVer from Conventional Commits). See #27.
version = "0.1.0"
description = "Azure Policy catalogue + EPAC scaffold builder (stdlib-only)."
# CI runs on 3.11 (.github/workflows/contoso-epac-build.yml); the code needs 3.8+ at minimum
# (assignment expressions), so 3.10 is a comfortable, tested-adjacent floor.
requires-python = ">=3.10"
dependencies = []
