name: epac-builder regression test

on:
  push:
    paths:
      - "catalogue-builder/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "catalogue-builder/**"
      - ".github/workflows/test.yml"

jobs:
  golden-fixture-diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalogue-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build scaffold from the reference manifest
        run: |
          python flows/epac_builder/assemble_scaffold.py \
            --manifest examples/contoso/manifests/manifest.example.jsonc \
            --out "$RUNNER_TEMP/package-out"

      - name: Diff against committed reference package
        run: |
          diff -rq "$RUNNER_TEMP/package-out" examples/contoso/package
        # Full-tree diff, docs/ included: examples/contoso/package/docs/*.svg is in sync with
        # examples/contoso/designs/ (the verbatim source package.py copies via shutil.copy2), so
        # the SVG passthrough is part of the determinism contract this test checks. (The worked
        # sample moved out of customer/ — now the empty scaffold — in backlog #10.)
