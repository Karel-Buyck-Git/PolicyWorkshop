name: epac-builder regression test

on:
  push:
    paths:
      - "catalogue-builder/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "catalogue-builder/**"
      - ".github/workflows/test.yml"

jobs:
  golden-fixture-diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalogue-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build scaffold from the reference manifest
        run: |
          python flows/epac_builder/assemble_scaffold.py \
            --manifest customer/manifests/manifest.example.jsonc \
            --out "$RUNNER_TEMP/package-out"

      - name: Diff against committed reference package
        run: |
          diff -rq "$RUNNER_TEMP/package-out" customer/package
        # Full-tree diff, docs/ included: customer/package/docs/*.svg is now in sync with
        # customer/designs/ (the verbatim source package.py copies via shutil.copy2), so the
        # SVG passthrough is part of the determinism contract this test checks.
