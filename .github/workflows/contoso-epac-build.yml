name: contoso epac build

# Thin trigger: the regression logic lives with the example, in
# epac-workbench/examples/contoso/verify.sh (GitHub Actions requires the workflow
# YAML under .github/workflows/, so only the trigger lives here). verify.sh rebuilds the
# worked contoso sample for every renderer flavour (json, terraform, bicep) and diffs it
# byte-for-byte against the committed fixtures — the epac-builder determinism contract.
# A second step (below, not part of verify.sh) runs the MCP stdio server smoke test
# (engine/mcp_server/test_server.sh) so a regression in the server or validate_manifest
# can't ship undetected. Running verify.sh locally does NOT cover the MCP server.
#
# Fires when either builder changes: the engine (engine/**), the shared catalogue
# (catalogue/**), the example itself (examples/contoso/**), or the shared schemas the
# assembler validates against (customer/manifests/**).

on:
  push:
    paths:
      - "epac-workbench/engine/**"
      - "epac-workbench/catalogue/**"
      - "epac-workbench/examples/contoso/**"
      - "epac-workbench/customer/manifests/**"
      - ".github/workflows/contoso-epac-build.yml"
  pull_request:
    paths:
      - "epac-workbench/engine/**"
      - "epac-workbench/catalogue/**"
      - "epac-workbench/examples/contoso/**"
      - "epac-workbench/customer/manifests/**"
      - ".github/workflows/contoso-epac-build.yml"

jobs:
  contoso-epac-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: epac-workbench
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild every flavour and diff against committed fixtures
        run: bash examples/contoso/verify.sh

      - name: MCP stdio server smoke test
        run: bash engine/mcp_server/test_server.sh
