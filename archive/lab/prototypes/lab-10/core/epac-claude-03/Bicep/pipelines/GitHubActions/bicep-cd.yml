# Bicep Azure Policy - what-if on PR, deploy on merge. Copy to .github/workflows/.
# OIDC login (no secrets). SPN needs policy + role assignment rights at the management group.
name: Bicep Policy CD

on:
  pull_request:
    branches: [ main ]
    paths: [ 'Bicep/**' ]
  push:
    branches: [ main ]
    paths: [ 'Bicep/**' ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  MG_ID: contoso                                   # tenant01 root MG
  DEPLOY_LOCATION: westeurope
  PARAM_FILE: Bicep/main.parameters.tenant01.json

jobs:
  whatif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment mg what-if \
              --management-group-id "$MG_ID" \
              --location "$DEPLOY_LOCATION" \
              --template-file Bicep/main.bicep \
              --parameters @"$PARAM_FILE"

  deploy:
    needs: whatif
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: tenant01            # approval gate
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment mg create \
              --management-group-id "$MG_ID" \
              --location "$DEPLOY_LOCATION" \
              --template-file Bicep/main.bicep \
              --parameters @"$PARAM_FILE"
